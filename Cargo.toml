[package]
name = "bevy_rmmz_assets"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Load an RPG Maker MZ game database (data/*.json) as Bevy assets, with a resource layer, hot-reload, optional binary processing, and extensible note-metadata parsing."
repository = "https://github.com/Syynth/bevy_rmmz_assets"
readme = "README.md"
keywords = ["bevy", "rpgmaker", "rpgmaker-mz", "assets", "gamedev"]
categories = ["game-development"]

# Build docs.rs with every feature so the `maps` and `process` modules render.
[package.metadata.docs.rs]
all-features = true

[dependencies]
bevy_app = "0.19.0-rc.2"
bevy_asset = "0.19.0-rc.2"
bevy_ecs = "0.19.0-rc.2"
bevy_reflect = "0.19.0-rc.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# postcard backs both note-metadata baking and the binary asset format; it's
# small and pure-Rust, so it's a normal dependency rather than feature-gated.
postcard = { version = "1", default-features = false, features = ["use-std"] }

[features]
default = []
# Opt-in helpers for loading Map###.json assets (not the primary use case).
maps = []
# Enable Bevy's filesystem asset watcher for dev hot-reload.
file_watcher = ["bevy_asset/file_watcher"]
# Enable Bevy's asset processor to pre-process the database into compact binary.
process = ["bevy_asset/asset_processor"]

[dev-dependencies]
# Needed by integration tests and examples (which only see the crate + dev-deps)
# to construct a Bevy App and drive asset loading.
bevy_app = "0.19.0-rc.2"
bevy_asset = "0.19.0-rc.2"
bevy_ecs = "0.19.0-rc.2"
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
# --- Pedantic baseline (warn, not deny — CI promotes via -D warnings) ---
pedantic = { level = "warn", priority = -1 }

# --- Pedantic allows: known false positives / premature for this stage ---
needless_pass_by_value = "allow"   # Bevy systems take Query/Res by value
type_complexity = "allow"          # Bevy query types are inherently complex
module_name_repetitions = "allow"  # Domain-first naming (asset::AssetError)
must_use_candidate = "allow"       # Too noisy during active development
missing_errors_doc = "allow"       # APIs still evolving rapidly
missing_panics_doc = "allow"       # APIs still evolving rapidly
return_self_not_must_use = "allow" # Builder patterns before API stabilization
struct_excessive_bools = "allow"   # Legitimate for config/table structs
cast_possible_truncation = "allow" # RMMZ ids/columns use intentional integer widths
cast_sign_loss = "allow"           # Same
cast_precision_loss = "allow"      # Same

# --- Restriction lints: cherry-picked for real bug prevention ---
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"
exit = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
rest_pat_in_fully_bound_structs = "warn"
verbose_file_reads = "warn"
allow_attributes = "warn"
