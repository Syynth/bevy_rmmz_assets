name: Release

# Publish to crates.io when a version tag is pushed (e.g. `v0.1.1`).
# Bump the version + update CHANGELOG.md by hand, commit, then:
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags:
      - "v*"

# Least privilege: read the repo, mint an OIDC token for crates.io Trusted
# Publishing, and write a GitHub Release. No long-lived registry token is stored.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # Optional gate: require a manual approval before this job can run.
    # Configure reviewers under Settings > Environments > crates-io.
    environment: crates-io
    steps:
      # Third-party actions are pinned to full commit SHAs (not mutable tags)
      # because they run in the job that holds the publish token. Bump via
      # Dependabot; the trailing comment tracks the human-readable version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96

      # Belt-and-suspenders: the tag should only ever land on a green main,
      # but verify here too before anything leaves the runner.
      - run: cargo test --all-features

      # Exchange the workflow's OIDC identity for a short-lived crates.io token.
      # No secret to leak: the token is scoped to this crate and expires fast.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
